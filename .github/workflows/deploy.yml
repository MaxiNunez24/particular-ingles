# Publica el sitio en GitHub Pages con cada push a `main`:
#   https://maxinunez24.github.io/particular-ingles/
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # para republicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que la segunda espere en vez de pisarse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
